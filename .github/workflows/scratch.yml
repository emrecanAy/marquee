name: scratch
on:
  push:
    branches: [work]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool install --global dotnet-ef --version "10.*"
      - run: dotnet build Marquee.slnx --configuration Release 2>&1 | grep -E " error |warning|Build succeeded" | sort -u | head -60; test ${PIPESTATUS[0]} -eq 0
      - name: migrations
        run: |
          dotnet ef migrations add Initial --project src/Modules/Marquee.Identity --startup-project src/Marquee.Api --context IdentityDbContext --output-dir Persistence/Migrations --configuration Release --no-build
          dotnet ef migrations add ReservationAccount --project src/Modules/Marquee.Booking --startup-project src/Marquee.Api --context BookingDbContext --output-dir Persistence/Migrations --configuration Release --no-build
          tar czf /tmp/m.tgz src/Modules/Marquee.Identity/Persistence/Migrations src/Modules/Marquee.Booking/Persistence/Migrations
          echo "MIGRATIONS-BEGIN"; base64 -w0 /tmp/m.tgz; echo; echo "MIGRATIONS-END"
      - run: dotnet test Marquee.slnx --configuration Release --logger "console;verbosity=normal"
