name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Marquee.slnx
      - run: dotnet build Marquee.slnx --no-restore --configuration Release
      # Integration tests start PostgreSQL and Redis through Testcontainers on the runner's Docker.
      - run: dotnet test Marquee.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --file src/Marquee.Api/Dockerfile --tag marquee-api .
      - run: docker build --tag marquee-web web
