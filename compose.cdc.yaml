# Adds change data capture on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.cdc.yaml up --build
#
# PostgreSQL WAL -> Debezium -> Kafka -> the API's audit consumer -> audit.change_events
# Result: http://localhost:8080/activity
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.2
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: marquee-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Registers the connector once the API has created the tables it captures. PUT is idempotent,
  # so running the stack again just confirms the same configuration.
  connect-init:
    image: curlimages/curl:8.14.1
    volumes:
      - ./deploy/debezium/connector.json:/connector.json:ro
    entrypoint:
      - sh
      - -c
      - |
        until curl -fsS http://api:8080/health > /dev/null; do sleep 2; done
        until curl -fsS -X PUT -H 'Content-Type: application/json' --data @/connector.json \
          http://connect:8083/connectors/marquee-postgres/config > /dev/null; do sleep 2; done
        echo 'Debezium connector registered.'
    depends_on:
      - connect
      - api

  api:
    environment:
      Audit__KafkaBootstrapServers: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
